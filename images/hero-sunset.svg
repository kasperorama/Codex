<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t">
  <title id="t">Sunset over the Bay of Palma with La Seu cathedral, palms and a party yacht</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1055"/><stop offset=".35" stop-color="#7a1f7a"/>
      <stop offset=".62" stop-color="#ff4f7b"/><stop offset=".82" stop-color="#ff9a3c"/><stop offset="1" stop-color="#ffd166"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3a0"/><stop offset=".5" stop-color="#ffb347"/><stop offset="1" stop-color="#ff3d7f"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6f91"/><stop offset=".3" stop-color="#6a2c91"/><stop offset="1" stop-color="#0b1d4a"/>
    </linearGradient>
    <clipPath id="sunclip"><rect x="0" y="0" width="1200" height="455"/></clipPath>
    <filter id="glow"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="1200" height="700" fill="url(#sky)"/>
  <g fill="#fff" opacity=".8">
    <circle cx="90" cy="60" r="1.6"/><circle cx="240" cy="110" r="1.2"/><circle cx="420" cy="40" r="1.8"/>
    <circle cx="880" cy="70" r="1.4"/><circle cx="1010" cy="30" r="1.8"/><circle cx="1130" cy="120" r="1.2"/>
  </g>
  <circle cx="600" cy="420" r="210" fill="#ffb347" opacity=".45" filter="url(#glow)"/>
  <g clip-path="url(#sunclip)">
    <circle cx="600" cy="420" r="190" fill="url(#sun)"/>
    <g fill="#ff4f7b" opacity=".9">
      <rect x="380" y="340" width="440" height="7"/><rect x="380" y="365" width="440" height="10"/>
      <rect x="380" y="392" width="440" height="13"/><rect x="380" y="421" width="440" height="17"/>
    </g>
  </g>
  <!-- La Seu cathedral silhouette -->
  <g fill="#2a0f3f">
    <path d="M150 455 V360 h40 v-50 l10-30 10 30 v50 h30 v-40 h22 v-60 l11-30 11 30 v60 h22 v40 h120 v-50 l12-35 12 35 v50 h40 v-30 h30 v-55 l11-25 11 25 v55 h26 v75 z"/>
    <path d="M0 455 V420 h60 v-20 h40 v20 h50 v35 z"/>
    <path d="M540 455 v-30 h70 v-15 h60 v45 z"/>
  </g>
  <rect y="455" width="1200" height="245" fill="url(#sea)"/>
  <g stroke="#ffd166" stroke-width="4" stroke-linecap="round" opacity=".75">
    <line x1="470" y1="475" x2="730" y2="475"/><line x1="500" y1="500" x2="700" y2="500"/>
    <line x1="530" y1="528" x2="670" y2="528"/><line x1="555" y1="560" x2="645" y2="560"/>
    <line x1="578" y1="595" x2="622" y2="595"/>
  </g>
  <!-- party yacht -->
  <g transform="translate(760 470)">
    <path d="M0 40 h260 l-30 32 H24 z" fill="#f6f0e6"/>
    <path d="M40 40 v-26 h150 l30 26 z" fill="#f6f0e6"/>
    <rect x="60" y="20" width="110" height="10" fill="#00c2c7"/>
    <line x1="120" y1="14" x2="120" y2="-70" stroke="#f6f0e6" stroke-width="4"/>
    <path d="M120 -70 L60 14" stroke="#ffd166" stroke-width="2"/>
    <path d="M120 -70 L200 14" stroke="#ffd166" stroke-width="2"/>
    <g>
      <circle cx="80" cy="-18" r="5" fill="#ff3d7f"/><circle cx="100" cy="-38" r="5" fill="#00e0c6"/>
      <circle cx="140" cy="-38" r="5" fill="#ffd166"/><circle cx="165" cy="-12" r="5" fill="#ff3d7f"/>
      <circle cx="185" cy="4" r="5" fill="#00e0c6"/>
    </g>
    <g fill="#2a0f3f">
      <circle cx="75" cy="6" r="6"/><rect x="70" y="10" width="10" height="12"/>
      <circle cx="98" cy="4" r="6"/><rect x="93" y="8" width="10" height="14"/>
      <path d="M103 10 l14 -18" stroke="#2a0f3f" stroke-width="3"/>
      <circle cx="150" cy="6" r="6"/><rect x="145" y="10" width="10" height="12"/>
    </g>
  </g>
  <!-- palms -->
  <g fill="#1a0930">
    <path d="M70 700 C90 600 100 520 88 420 l10 0 C115 520 110 610 96 700 z"/>
    <path d="M92 425 c-60 -30 -110 -10 -140 20 c50 -20 90 -20 140 -12 z"/>
    <path d="M92 425 c-30 -60 -90 -80 -130 -70 c50 10 90 30 126 76 z"/>
    <path d="M92 425 c20 -60 80 -85 130 -75 c-50 5 -90 30 -124 78 z"/>
    <path d="M92 425 c60 -20 110 0 140 35 c-50 -22 -95 -25 -138 -30 z"/>
    <path d="M92 425 c0 -50 20 -90 40 -110 c-15 30 -25 70 -34 112 z"/>
    <path d="M1120 700 C1110 610 1100 540 1115 470 l10 2 C1112 545 1122 615 1140 700 z"/>
    <path d="M1118 474 c-50 -35 -110 -25 -140 5 c50 -18 95 -15 138 0 z"/>
    <path d="M1118 474 c-20 -55 -70 -80 -120 -78 c45 10 85 35 116 82 z"/>
    <path d="M1118 474 c30 -50 80 -65 120 -55 c-45 3 -85 25 -114 60 z"/>
    <path d="M1118 474 c50 -10 90 15 110 45 c-40 -22 -75 -30 -108 -40 z"/>
  </g>
  <!-- neon grid -->
  <g stroke="#ff3d7f" stroke-width="1.5" opacity=".35">
    <line x1="0" y1="640" x2="1200" y2="640"/><line x1="0" y1="670" x2="1200" y2="670"/>
    <line x1="600" y1="610" x2="200" y2="700"/><line x1="600" y1="610" x2="1000" y2="700"/>
    <line x1="600" y1="610" x2="400" y2="700"/><line x1="600" y1="610" x2="800" y2="700"/>
    <line x1="600" y1="610" x2="600" y2="700"/>
  </g>
</svg>
