    <rect x="4" y="120" width="52" height="56" fill="#f6efe0"/><text x="30" y="145" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#5a0624">MANTO</text>
    <text x="30" y="160" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#5a0624">NEGRO</text>
  </g>
