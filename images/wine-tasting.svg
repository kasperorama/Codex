<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-labelledby="t">
  <title id="t">Wine tasting among the vineyards of Binissalem with the Tramuntana mountains</title>
  <defs>
    <linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb3c7"/><stop offset=".7" stop-color="#ffd59e"/><stop offset="1" stop-color="#fff0c2"/></linearGradient>
    <linearGradient id="v" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cae5b"/><stop offset="1" stop-color="#3e6b36"/></linearGradient>
    <linearGradient id="r" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b3124a"/><stop offset="1" stop-color="#5a0624"/></linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#s)"/>
  <circle cx="140" cy="140" r="60" fill="#fff6d6"/>
  <path d="M0 290 L90 200 L160 240 L260 150 L350 220 L440 170 L600 260 V330 H0 z" fill="#8f6aa6"/>
  <path d="M0 320 L120 260 L230 300 L360 250 L480 290 L600 270 V360 H0 z" fill="#b085b8"/>
  <rect y="340" width="600" height="260" fill="url(#v)"/>
  <g stroke="#2f5228" stroke-width="10" stroke-linecap="round">
    <line x1="300" y1="360" x2="-60" y2="600"/><line x1="300" y1="360" x2="80" y2="600"/><line x1="300" y1="360" x2="220" y2="600"/>
    <line x1="300" y1="360" x2="380" y2="600"/><line x1="300" y1="360" x2="520" y2="600"/><line x1="300" y1="360" x2="660" y2="600"/>
  </g>
  <!-- cypress & finca -->
  <path d="M500 340 c-12 -40 -10 -90 10 -130 c20 40 22 90 10 130 z" fill="#2c4a2a"/>
  <rect x="420" y="300" width="70" height="42" fill="#f3d9b1"/><path d="M412 302 l43 -24 43 24 z" fill="#c4643a"/>
  <!-- table -->
  <rect x="0" y="470" width="600" height="130" fill="#f6efe0"/>
  <g fill="#e05a7a" opacity=".6"><rect x="0" y="470" width="40" height="130"/><rect x="80" y="470" width="40" height="130"/><rect x="160" y="470" width="40" height="130"/><rect x="240" y="470" width="40" height="130"/><rect x="320" y="470" width="40" height="130"/><rect x="400" y="470" width="40" height="130"/><rect x="480" y="470" width="40" height="130"/><rect x="560" y="470" width="40" height="130"/></g>
  <!-- bottle -->
  <g transform="translate(120 290)">
