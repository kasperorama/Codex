    <g fill="#fff" opacity=".9"><circle cx="-60" cy="-30" r="3"/><circle cx="-20" cy="-40" r="3"/><circle cx="30" cy="-25" r="3"/><circle cx="70" cy="-5" r="3"/><circle cx="-80" cy="10" r="3"/><circle cx="10" cy="20" r="3"/><circle cx="60" cy="30" r="3"/><circle cx="-40" cy="35" r="3"/><circle cx="100" cy="-35" r="3"/></g>
