<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-labelledby="t">
  <title id="t">Breakfast in bed: an ensaïmada and cava by the balcony</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9ae6e0"/><stop offset="1" stop-color="#ffc3d6"/></linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <!-- window -->
  <rect x="340" y="40" width="220" height="280" fill="#56c3ea"/><rect x="340" y="220" width="220" height="100" fill="#1f7fc2"/>
  <rect x="340" y="40" width="220" height="280" fill="none" stroke="#fff" stroke-width="12"/><line x1="450" y1="40" x2="450" y2="320" stroke="#fff" stroke-width="8"/>
  <circle cx="400" cy="100" r="26" fill="#fff3a0"/>
