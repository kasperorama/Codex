<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-labelledby="t">
  <title id="t">Table of Mallorcan tapas: pa amb oli, sobrassada, olives and gambas</title>
  <defs>
    <radialGradient id="bg" cx=".5" cy=".4" r=".8"><stop offset="0" stop-color="#ffe2a8"/><stop offset="1" stop-color="#ff8a5c"/></radialGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <!-- tiles -->
  <g opacity=".22" fill="#0a6f8a">
    <path d="M0 0 h60 v60 h-60z M120 0 h60 v60 h-60z M240 0 h60 v60 h-60z M360 0 h60 v60 h-60z M480 0 h60 v60 h-60z M60 60 h60 v60 h-60z M180 60 h60 v60 h-60z M300 60 h60 v60 h-60z M420 60 h60 v60 h-60z M540 60 h60 v60 h-60z"/>
  </g>
  <ellipse cx="300" cy="360" rx="290" ry="210" fill="#f7efe0"/>
  <ellipse cx="300" cy="360" rx="290" ry="210" fill="none" stroke="#0a6f8a" stroke-width="10" stroke-dasharray="4 18"/>
  <!-- pa amb oli -->
  <g transform="translate(90 260)">
    <ellipse cx="80" cy="50" rx="95" ry="55" fill="#d9a25f"/><ellipse cx="80" cy="46" rx="80" ry="44" fill="#f2d39b"/>
    <circle cx="50" cy="40" r="18" fill="#e5322d"/><circle cx="95" cy="30" r="16" fill="#e5322d"/><circle cx="110" cy="60" r="15" fill="#e5322d"/>
    <path d="M40 60 q30 -10 60 8" stroke="#b7c94a" stroke-width="6" fill="none" opacity=".7"/>
  </g>
  <!-- sobrassada -->
  <g transform="translate(330 200)">
    <ellipse cx="90" cy="60" rx="100" ry="50" fill="#fff" stroke="#0a6f8a" stroke-width="4"/>
    <circle cx="55" cy="55" r="26" fill="#c9372c"/><circle cx="55" cy="55" r="18" fill="#e45c3f"/>
    <circle cx="110" cy="50" r="26" fill="#c9372c"/><circle cx="110" cy="50" r="18" fill="#e45c3f"/>
    <circle cx="140" cy="75" r="22" fill="#c9372c"/><circle cx="140" cy="75" r="14" fill="#e45c3f"/>
  </g>
  <!-- olives -->
  <g transform="translate(360 380)">
    <ellipse cx="60" cy="40" rx="70" ry="40" fill="#c4643a"/><ellipse cx="60" cy="36" rx="60" ry="32" fill="#8a3f22"/>
    <g fill="#6f8f2a"><ellipse cx="30" cy="30" rx="12" ry="9"/><ellipse cx="55" cy="22" rx="12" ry="9"/><ellipse cx="80" cy="34" rx="12" ry="9"/><ellipse cx="45" cy="46" rx="12" ry="9"/><ellipse cx="72" cy="52" rx="12" ry="9"/></g>
    <g fill="#2a2a1a"><ellipse cx="96" cy="46" rx="11" ry="8"/><ellipse cx="20" cy="50" rx="11" ry="8"/></g>
  </g>
  <!-- gambas -->
  <g transform="translate(150 410)">
    <ellipse cx="80" cy="45" rx="90" ry="45" fill="#3b2a24"/><ellipse cx="80" cy="42" rx="78" ry="36" fill="#d88a2c"/>
    <g fill="none" stroke="#ff6b4a" stroke-width="12" stroke-linecap="round">
      <path d="M30 40 q20 -25 40 0"/><path d="M75 30 q20 -25 40 0"/><path d="M60 60 q20 -25 40 0"/><path d="M105 55 q15 -20 30 0"/>
    </g>
  </g>
  <!-- vermouth glass -->
  <g transform="translate(500 330)">
    <path d="M0 0 h50 v90 h-50z" fill="#b3124a" opacity=".75" stroke="#fff" stroke-width="3"/>
    <circle cx="25" cy="20" r="8" fill="#ffa62b"/>
  </g>
</svg>
